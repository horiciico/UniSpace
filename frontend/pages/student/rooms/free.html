<!DOCTYPE html>
<html lang="ro">
  <head>
    <!--#include virtual="/components/head.html" -->
    <title data-i18n="free.title">Săli libere · UniSpace</title>
    <script src="/js/api.js" defer></script>
    <script src="/js/modules.js" defer></script>
    <script src="/js/pages/free.js" defer></script>
  </head>
  <body>
    <main id="main" class="container">
      <p class="eyebrow" data-i18n="free.eyebrow">Săli libere</p>
      <h1 data-i18n="free.heading">Libere acum</h1>
      <p class="muted" data-i18n="free.intro">Săli bookabile libere acum sau într-un interval ales. Alege un filtru ca să restrângi lista.</p>

      <div class="card__meta my-5">
        <div class="tabs" role="tablist" data-i18n-attr="aria-label:free.modeAria" aria-label="Mod de căutare">
          <button class="tab" role="tab" type="button" data-free-mode="now" aria-selected="true" data-i18n="free.modeNow">Liber acum</button>
          <button class="tab" role="tab" type="button" data-free-mode="custom" aria-selected="false" data-i18n="free.modeCustom">Interval personalizat</button>
        </div>

        <div class="tt-filters">
          <div id="free-custom" hidden>
            <div class="tt-filters">
              <label class="field">
                <span class="field__label" data-i18n="free.date">Data</span>
                <input id="free-date" type="date" />
              </label>
              <label class="field">
                <span class="field__label" data-i18n="free.start">De la</span>
                <select id="free-from"></select>
              </label>
              <label class="field">
                <span class="field__label" data-i18n="free.end">Până la</span>
                <select id="free-to"></select>
              </label>
            </div>
          </div>
          <label class="field">
            <span class="field__label" data-i18n="free.faculty">Facultate</span>
            <select id="free-faculty" required>
              <option value="" data-i18n="free.chooseFaculty">Alege o facultate</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label" data-i18n="free.minCapacity">Capacitate minimă</span>
            <input id="free-capacity" type="number" min="0" step="1" />
          </label>
          <label class="check">
            <input id="free-projector" type="checkbox" />
            <span data-i18n="free.projector">Proiector</span>
          </label>
          <label class="check">
            <input id="free-verified" type="checkbox" />
            <span data-i18n="free.verifiedOnly">Doar verificate pe teren</span>
          </label>
        </div>
      </div>

      <p class="muted" id="free-status" role="status" aria-live="polite"></p>
      <ul class="room-grid" id="free-list" aria-live="polite"></ul>
      <p class="muted mt-5" data-i18n="free.note">Sălile care nu sunt verificate pe teren au date estimate.</p>
    </main>
  </body>
</html>
