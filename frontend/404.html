<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="notFound.title">Page not found · UniSpace</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <meta name="theme-color" content="#263EC9" />
    <script src="/i18n/i18n.js"></script>
    <script src="/i18n/ro.js"></script>
    <script src="/i18n/en.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js" defer></script>
  </head>
  <body>
    <main id="main" class="container">
      <div class="error-page">
        <p class="error-page__code" aria-hidden="true">404</p>
        <h1 data-i18n="notFound.heading">This room is not on the map</h1>
        <p class="muted" data-i18n="notFound.text">The page you asked for does not exist, or moved.</p>
        <div class="btn-group" style="justify-content: center">
          <a class="btn btn-primary" href="/" data-i18n="notFound.home">Go home</a>
          <a class="btn" href="/timetable" data-i18n="notFound.openTimetable">Open the timetable</a>
          <a class="btn btn-ghost" href="/rooms/free" data-i18n="notFound.freeRooms">Free rooms</a>
        </div>
      </div>
    </main>
  </body>
</html>
