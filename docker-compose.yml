name: unispace

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unispace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unispace}
      POSTGRES_DB: ${POSTGRES_DB:-unispace}
    ports:
      - "${POSTGRES_PORT:-5431}:5431"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unispace}:${POSTGRES_PASSWORD:-unispace}@db:5431/${POSTGRES_DB:-unispace}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Dev only: live code reload. Remove for a production-like run.
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
