# nginx for the static frontend. Mounted by docker-compose.yml over conf.d/default.conf.
#
# Layout (frontend/, see docs/agents/ARCHITECTURE.md):
#   pages/<role>/...   the pages. Every page is gated: a signed-out visitor goes to /login,
#                      a signed-in non-admin going to /admin goes home.
#   components/        shared head and component scripts (public: no data in them)
#   styles/            CSS (public)     js/, i18n/ scripts (public)
#
# Clean URLs map to a page file below. The mapping is explicit, so each URL's gate is
# visible in one place. Typing a file path (/pages/...) is gated too.
#
# Public: /login and its assets, /styles, /components, /js, /i18n, /health, /auth/*.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile so Windows volume mount edits are reflected immediately
    sendfile off;

    # Server-side includes: pages pull in components/head.html with <!--#include -->.
    ssi on;

    # Redirects stay relative (/login), so they keep the port the browser used (8080 locally).
    absolute_redirect off;

    # --- Public: sign-in page and the static assets -----------------------------------
    location = /pages/shared/login.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        rewrite ^ /pages/shared/login.html break;
        add_header Cache-Control "no-cache";
    }
    location = /login.html {
        return 301 /login;
    }
    location ^~ /styles/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /components/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /i18n/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # --- Session check, called by auth_request (never reachable from outside) ----------
    location = /_auth {
        internal;
        proxy_pass http://backend:8000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /_auth_admin {
        internal;
        proxy_pass http://backend:8000/auth/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Gated pages: clean URL -> page file ------------------------------------------
    # Each location checks the session first, then serves the page file (rewrite ... break).
    location = / {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/shared/index.html break;
        add_header Cache-Control "no-store";
    }
    location = /timetable {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/timetable.html break;
        add_header Cache-Control "no-store";
    }
    location = /calendar {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/calendar.html break;
        add_header Cache-Control "no-store";
    }
    location = /changes {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/changes.html break;
        add_header Cache-Control "no-store";
    }
    location = /announcements {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/professor/announcements.html break;
        add_header Cache-Control "no-store";
    }
    location = /rooms {
        return 301 /rooms/;
    }
    location = /rooms/ {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/rooms/index.html break;
        add_header Cache-Control "no-store";
    }
    location = /rooms/detail {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/rooms/detail.html break;
        add_header Cache-Control "no-store";
    }
    location = /rooms/free {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/rooms/free.html break;
        add_header Cache-Control "no-store";
    }
    location = /bookings {
        return 301 /bookings/;
    }
    location = /bookings/ {
        auth_request /_auth;
        error_page 401 = @to_login;
        rewrite ^ /pages/student/bookings/index.html break;
        add_header Cache-Control "no-store";
    }
    # Admin pages: signed out -> /login, signed in but not an admin -> home.
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        auth_request /_auth_admin;
        error_page 401 = @to_login;
        error_page 403 = @to_home;
        rewrite ^ /pages/admin/index.html break;
        add_header Cache-Control "no-store";
    }

    # --- Gated: page files typed directly -----------------------------------------------
    location ^~ /pages/admin/ {
        auth_request /_auth_admin;
        error_page 401 = @to_login;
        error_page 403 = @to_home;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location ^~ /pages/ {
        auth_request /_auth;
        error_page 401 = @to_login;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Any other URL: signed out -> /login (nothing is revealed); signed in -> 404 page.
    # The gate runs in the access phase; `return` would run earlier and skip it, so this
    # location falls through to the 404 page with the 404 status.
    location / {
        auth_request /_auth;
        error_page 401 = @to_login;
        error_page 404 @not_found;
        try_files /_no_such_file =404;
    }
    location @not_found {
        internal;
        rewrite ^ /pages/shared/404.html break;
    }

    location @to_login {
        return 302 /login;
    }
    location @to_home {
        return 302 /;
    }

    # --- Backend, on the same origin so the browser never needs CORS ---------------
    location ~ ^/(api/|health$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in routes (C-002). Same origin, so the session cookie works for the pages too.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google sends the browser here. A rejection would show raw JSON, so send it
    # back to the login page with a reason instead.
    location = /auth/callback {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 403 = @login_denied;
        error_page 400 = @login_failed;
    }
    location @login_denied {
        return 302 /login?error=denied;
    }
    location @login_failed {
        return 302 /login?error=failed;
    }

    # Unknown URLs that got past the gate: the 404 page (internal, not reachable directly).
    error_page 404 /pages/shared/404.html;
    location = /pages/shared/404.html {
        internal;
        try_files $uri =404;
    }
}
