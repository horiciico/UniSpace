# nginx for the static frontend. Mounted by docker-compose.yml over conf.d/default.conf.
#
# Every page needs a signed-in session. nginx asks the backend (GET /auth/me, C-002)
# before it serves a page, so typing a URL in the address bar does not get around it.
# Public: the login page, its CSS and JS (no data in them), /health and the /auth/ routes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile so Windows volume mount edits are reflected immediately
    sendfile off;

    # Redirects stay relative (/login), so they keep the port the browser used (8080 locally).
    absolute_redirect off;

    # --- Public: login page and the assets it needs -------------------------------
    location = /login {
        try_files /login.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login.html {
        return 301 /login;
    }
    location ^~ /css/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /i18n/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # --- Session check, called by auth_request below (never reachable from outside) --
    location = /_auth {
        internal;
        proxy_pass http://backend:8000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /_auth_admin {
        internal;
        proxy_pass http://backend:8000/auth/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Protected pages -----------------------------------------------------------
    # Clean URLs. /timetable -> timetable.html, /rooms -> rooms/index.html.
    # Signed out: 302 to /login, also for URLs that do not exist (nothing is revealed).
    location / {
        auth_request /_auth;
        error_page 401 = @to_login;
        error_page 404 /404.html;
        try_files $uri/ $uri.html $uri =404;
        add_header Cache-Control "no-store";
    }

    # Admin pages: signed out -> /login, signed in but not an admin -> home.
    location ~ ^/admin(/|$) {
        auth_request /_auth_admin;
        error_page 401 = @to_login;
        error_page 403 = @to_home;
        error_page 404 /404.html;
        try_files $uri/ $uri.html $uri =404;
        add_header Cache-Control "no-store";
    }

    location @to_login {
        return 302 /login;
    }
    location @to_home {
        return 302 /;
    }

    # --- Backend, on the same origin so the browser never needs CORS ---------------
    location ~ ^/(api/|health$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in routes (C-002). Same origin, so the session cookie works for the pages too.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google sends the browser here. A rejection would show raw JSON, so send it
    # back to the login page with a reason instead.
    location = /auth/callback {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 403 = @login_denied;
        error_page 400 = @login_failed;
    }
    location @login_denied {
        return 302 /login?error=denied;
    }
    location @login_failed {
        return 302 /login?error=failed;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
