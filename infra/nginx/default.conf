# nginx for the static frontend. Mounted by docker-compose.yml over conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs. /timetable -> timetable.html, /rooms -> rooms/index.html,
    # /css/base.css -> the file itself. Anything else is a 404 page.
    location / {
        try_files $uri/ $uri.html $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Backend, on the same origin so the browser never needs CORS.
    location ~ ^/(api/|health$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
