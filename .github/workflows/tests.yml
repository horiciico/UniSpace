# Runs the three test suites (backend, ETL, frontend) on every push and every pull request.
# Each suite runs as its own parallel job in CI.
# Local runs:
#   node scripts/test-all.mjs           # all suites
#   node scripts/test-all.mjs <suite>   # single suite (backend | etl | frontend)
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            name: Backend Tests
          - suite: etl
            name: ETL Tests
          - suite: frontend
            name: Frontend Tests
    steps:
      - uses: actions/checkout@v4

      # The compose file needs these values. CI uses placeholders: no test reaches Google,
      # and the database is the throwaway one of the test stack. Never put real secrets here.
      - name: Create the test stack's .env (placeholders only)
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' \
            -e 's/^PGADMIN_DEFAULT_PASSWORD=.*/PGADMIN_DEFAULT_PASSWORD=ci-only-password/' \
            -e 's/^GOOGLE_WEB_CLIENT_ID=.*/GOOGLE_WEB_CLIENT_ID=ci-placeholder/' \
            -e 's/^GOOGLE_WEB_CLIENT_SECRET=.*/GOOGLE_WEB_CLIENT_SECRET=ci-placeholder/' \
            -e 's/^SESSION_SECRET_KEY=.*/SESSION_SECRET_KEY=ci-placeholder-session-key/' \
            .env

      - name: Run ${{ matrix.name }}
        run: node scripts/test-all.mjs ${{ matrix.suite }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.suite }}
          path: output/test-report.md
          if-no-files-found: warn
